name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Submodules Manually
        run: |
          git submodule init
          git submodule update --init --recursive

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Force Disable Picotool
        run: |
          echo "set(DISABLE_PICOTOOL ON)" >> CMakeLists.txt
          echo "set(PICO_NO_PICOTOOL ON)" >> CMakeLists.txt

      - name: Apply TinyUSB Naming Patch
        run: |
          rm -f hid_pid.h
          echo "#ifndef HID_PID_PATCH_H" > hid_pid.h
          echo "#define HID_PID_PATCH_H" >> hid_pid.h
          echo "#include \"class/hid/hid.h\"" >> hid_pid.h
          echo "#define HID_USAGE_PID_EFFECT_PARAM_BLOCK_LOAD_STATUS HID_USAGE_PID_EFFECT_PARAMETER_BLOCK_LOAD_STATUS" >> hid_pid.h
          echo "#define HID_USAGE_PID_PARAM_BLOCK_POOLS_REPORT HID_USAGE_PID_PARAMETER_BLOCK_POOLS_REPORT" >> hid_pid.h
          echo "#define HID_USAGE_PID_DEVICE_MANAGED_POOL HID_USAGE_PID_DEVICEMANAGED_POOL" >> hid_pid.h
          echo "#endif" >> hid_pid.h

      - name: Compile
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -DPICO_SDK_FETCH_FROM_GIT=on ..
          ninja

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
