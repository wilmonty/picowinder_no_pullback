name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Compilers and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build python3

      - name: Fetch SDK via Submodule
        run: |
          git clone --depth 1 -b 1.5.1 https://github.com sdk_source || true
          echo "PICO_SDK_PATH=${{ github.workspace }}/build/_deps/pico_sdk-src" >> $GITHUB_ENV

      - name: Compile Custom Binary
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -DPICO_SDK_FETCH_FROM_GIT=on -DDISABLE_PICOTOOL=ON ..
          ninja

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
