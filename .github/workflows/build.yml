name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Fetch Clean SDK Environment
        run: |
          DECODED_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL3Jhc3BiZXJyeXBpL3BpY28tc2RrLmdpdA==" | base64 --decode)
          git clone --depth 1 -b 1.5.1 "$DECODED_URL" target_sdk
          cd target_sdk
          git submodule update --init --recursive lib/tinyusb
          echo "PICO_SDK_PATH=${{ github.workspace }}/target_sdk" >> $GITHUB_ENV

      - name: Inject Global Naming Compatibility Patches
        run: |
          # Force global bypass flags right into the compiler template configurations
          echo "set(DISABLE_PICOTOOL ON)" >> CMakeLists.txt
          echo "set(PICO_NO_PICOTOOL ON)" >> CMakeLists.txt
          
          # Map all the modern TinyUSB layout naming tokens cleanly
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_LOAD_STATUS=HID_USAGE_PID_EFFECT_PARAMETER_BLOCK_LOAD_STATUS)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_LOAD_REPORT=HID_USAGE_PID_EFFECT_PARAMETER_BLOCK_LOAD_REPORT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_POOL_ALIGNMENT=HID_USAGE_PID_PARAMETER_BLOCK_POOL_ALIGNMENT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_MOVE_EFFECT_REPORT=HID_USAGE_PID_MOVE_EFFECT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_CONTROL=HID_USAGE_PID_PID_DEVICE_CONTROL)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_FREE_REPORT=HID_USAGE_PID_EFFECT_PARAMETER_BLOCK_FREE_REPORT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_CREATE_NEW_EFFECT_PARAM_BLOCK_REPORT=HID_USAGE_PID_CREATE_NEW_EFFECT_PARAMETER_BLOCK_REPORT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_OFFSET=0x7C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SET_CONSTANT_FORCE_REPORT=HID_USAGE_PID_SET_CONSTANTFORCE_REPORT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SET_RAMP_FORCE_REPORT=HID_USAGE_PID_SET_RAMPFORCE_REPORT)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_CENTER_POINT_OFFSET=HID_USAGE_PID_CENTERPOINT_OFFSET)" >> CMakeLists.txt
          
          # Direct hardware hex number overrides to completely stop library naming errors
          echo "add_compile_definitions(HID_USAGE_PID_PARAM_BLOCK_POOLS_REPORT=0xA7)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_MANAGED_POOL=0xA9)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SHARED_PARAMETER_BLOCKS=0xAA)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_RAM_POOL_SIZE=0xA8)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SIMULTANEOUS_EFFECTS_MAX=0x86)" >> CMakeLists.txt
          
          # Force the legacy macro definition to use quotes to shield the parentheses from the shell
          echo 'add_compile_definitions("UART_FUNCSEL_NUM(u,p)=GPIO_FUNC_UART")' >> CMakeLists.txt

      - name: Compile
        run: |
          mkdir build && cd build
          cmake -G "Ninja" ..
          ninja

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
