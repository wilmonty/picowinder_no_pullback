name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Original Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Clone Original SDK 1.5.1
        run: |
          git clone --depth 1 --branch 1.5.1 https://github.com ${{ github.workspace }}/pico-sdk
          cd ${{ github.workspace }}/pico-sdk
          git submodule update --init --recursive lib/tinyusb

      - name: Compile Custom Firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -DDISABLE_PICOTOOL=ON ..
          ninja

      - name: Upload Clean Firmware
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
