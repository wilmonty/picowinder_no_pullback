name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Joystick Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Automatic SDK Deployment
        uses: raspberrypi/setup-pico-sdk@v1
        with:
          version: '1.5.1'

      - name: Compile Custom Binary
        run: |
          mkdir build && cd build
          cmake -G "Ninja" -DDISABLE_PICOTOOL=ON ..
          ninja

      - name: Upload Clean Firmware
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
