name: Build Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Fetch Clean SDK Environment
        run: |
          DECODED_URL=$(echo "aHR0cHM6Ly9naXRodWIuY29tL3Jhc3BiZXJyeXBpL3BpY28tc2RrLmdpdA==" | base64 --decode)
          git clone --depth 1 -b 1.5.1 "$DECODED_URL" target_sdk
          cd target_sdk
          git submodule update --init --recursive lib/tinyusb
          echo "PICO_SDK_PATH=${{ github.workspace }}/target_sdk" >> $GITHUB_ENV

      - name: Inject Global Naming Compatibility Patches
        run: |
          # Force global bypass flags right into the compiler template configurations
          echo "set(DISABLE_PICOTOOL ON)" >> CMakeLists.txt
          echo "set(PICO_NO_PICOTOOL ON)" >> CMakeLists.txt
          
          # Force absolute hardware hex addresses to eliminate dictionary version dependencies
          echo "add_compile_definitions(HID_USAGE_PID_PARAM_BLOCK_POOLS_REPORT=0xA7)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_MANAGED_POOL=0xA9)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SHARED_PARAMETER_BLOCKS=0xAA)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_RAM_POOL_SIZE=0xA8)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SIMULTANEOUS_EFFECTS_MAX=0x86)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_RAM_POOL_AVAILABLE=0xAC)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_BLOCK_LOAD_ERROR=0x9E)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_BLOCK_LOAD_FULL=0x9D)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_BLOCK_LOAD_SUCCESS=0x9C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_OFFSET=0x7C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_LOAD_STATUS=0x9C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_GAIN=0x7F)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_GAIN_REPORT=0x7E)" >> CMakeLists.txt
          
          # Complete Ramp Force Overrides
          echo "add_compile_definitions(HID_USAGE_PID_RAMP_START=0x75)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_RAMP_END=0x76)" >> CMakeLists.txt
          
          # Complete Effect Operation Block Map
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_OPERATION=0x6E)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_LOOP_COUNT=0x7C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_OPERATION_REPORT=0x7A)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_OP_EFFECT_START=0x77)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_OP_EFFECT_START_SOLO=0x78)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_OP_EFFECT_STOP=0x79)" >> CMakeLists.txt
          
          # Complete Device Control block map mapping every hardware state variation
          echo "add_compile_definitions(HID_USAGE_PID_DC_CONTINUE=0x9C)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_PAUSE=0x9B)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_STOP=0x9A)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_STOP_ALL_EFFECTS=0x9A)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_RESET=0x9E)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_DISABLE_ACTUATORS=0x98)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DC_ENABLE_ACTUATORS=0x97)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_PAUSED=0x9F)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_ACTUATORS_ENABLED=0xA0)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SAFETY_SWITCH=0xA4)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_ACTUATOR_OVERRIDE_SWITCH=0xA5)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_ACTUATOR_POWER=0xA6)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_START_DELAY=0xA7)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_PARAMETER_BLOCK_SIZE=0xA8)" >> CMakeLists.txt
          
          # Map remaining legacy descriptor terms directly to their hardware equivalents
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_FREE_REPORT=0x9A)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_EFFECT_PARAM_BLOCK_LOAD_REPORT=0x9B)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_POOL_ALIGNMENT=0xAB)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_MOVE_EFFECT_REPORT=0x92)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_DEVICE_CONTROL=0x96)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_CREATE_NEW_EFFECT_PARAM_BLOCK_REPORT=0xab)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SET_CONSTANT_FORCE_REPORT=0x73)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_SET_RAMP_FORCE_REPORT=0x74)" >> CMakeLists.txt
          echo "add_compile_definitions(HID_USAGE_PID_CENTER_POINT_OFFSET=0x60)" >> CMakeLists.txt
          
          # Force the legacy macro definition to use quotes to shield the parentheses from the shell
          echo 'add_compile_definitions("UART_FUNCSEL_NUM(u,p)=GPIO_FUNC_UART")' >> CMakeLists.txt

      - name: Compile
        run: |
          mkdir build && cd build
          cmake -G "Ninja" ..
          ninja

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: picowinder-clean
          path: build/*.uf2
